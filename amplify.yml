version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next 16 needs Node 20+; the default Amplify image can be older.
        - nvm install 22 && nvm use 22
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify console env vars only exist at build time. Next.js SSR routes
        # read them at runtime, so copy the ones the server needs into
        # .env.production before building.
        # AWS_* names are reserved by Amplify: DynamoDB/Bedrock access comes from
        # the app's SSR compute role instead of access keys, and the data region
        # is set with VELOXIZ_AWS_REGION.
        - env | grep -E '^(APP_URL|AUTH_SECRET|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|BEDROCK_MODEL_ID|VELOXIZ_AWS_REGION)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
